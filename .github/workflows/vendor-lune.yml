name: Vendor pinned Lune source

on:
  push:
    paths:
      - ".github/workflows/vendor-lune.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned Lune source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lune-src upstream/lune
          git clone --no-checkout https://github.com/lune-org/lune.git /tmp/lune-src
          git -C /tmp/lune-src checkout d96087b46e8c3b751a50f6e80ca099e1008e7e33
          rm -rf /tmp/lune-src/.git
          mkdir -p upstream
          cp -a /tmp/lune-src upstream/lune
      - name: Commit vendored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yune vendor bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A upstream/lune
          if git diff --cached --quiet; then
            echo "Pinned Lune source is already vendored."
            exit 0
          fi
          git commit -m "Vendor pinned Lune source"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
