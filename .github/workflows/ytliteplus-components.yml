name: Build YTLitePlus components
on:
  push:
    branches: [build/ytliteplus-20261015]
    paths: [.github/workflows/ytliteplus-components.yml, ci/**]
permissions:
  contents: read
concurrency:
  group: ytliteplus-components
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      SOURCE_SHA: e9ace54254d1de84e0d47b87e6eb444420317de4
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install make ldid dpkg meson ninja
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "SOURCE=$RUNNER_TEMP/ytliteplus" >> "$GITHUB_ENV"
      - name: Fetch exact public source and dependencies
        run: |
          set -euxo pipefail
          git init "$SOURCE"
          git -C "$SOURCE" remote add origin https://github.com/bhackel/YTLitePlus.git
          git -C "$SOURCE" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$SOURCE" checkout --detach FETCH_HEAD
          git -C "$SOURCE" submodule update --init --recursive --jobs 4
          git init "$THEOS"
          git -C "$THEOS" remote add origin https://github.com/theos/theos.git
          git -C "$THEOS" fetch --depth=1 origin 3da31488281ecf4394d10302d2629607f4a1aa07
          git -C "$THEOS" checkout --detach FETCH_HEAD
          git -C "$THEOS" submodule update --init --recursive --jobs 4
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          ditto "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          git init "$RUNNER_TEMP/theos-jailed"
          git -C "$RUNNER_TEMP/theos-jailed" remote add origin https://github.com/qnblackcat/theos-jailed.git
          git -C "$RUNNER_TEMP/theos-jailed" fetch --depth=1 origin 662fd704aed27b8956bcfe52a35e2b676921ab42
          git -C "$RUNNER_TEMP/theos-jailed" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/theos-jailed" submodule update --init module/lib/fishhook
          "$RUNNER_TEMP/theos-jailed/install"
      - name: Prepare build inputs and compile video codecs
        run: |
          set -euxo pipefail
          mkdir -p "$SOURCE/tmp/Payload/YouTube.app"
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/fixture.c"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -Wl,-headerpad,0x8000 "$RUNNER_TEMP/fixture.c" -o "$SOURCE/tmp/Payload/YouTube.app/YouTube"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          root = Path(os.environ['SOURCE'])
          app = root / 'tmp/Payload/YouTube.app'
          info = {'CFBundleExecutable':'YouTube','CFBundleIdentifier':'com.google.ios.youtube','CFBundleName':'YouTube','CFBundleDisplayName':'YouTube','CFBundlePackageType':'APPL','CFBundleVersion':'21.41.5','CFBundleShortVersionString':'21.41.5','MinimumOSVersion':'17.0','UIDeviceFamily':[1,2]}
          (app / 'Info.plist').write_bytes(plistlib.dumps(info))
          p = root / 'Makefile'
          p.write_text(p.read_text().replace('PACKAGE_VERSION = X.X.X-X.X', 'PACKAGE_VERSION = 21.41.5-5.0.1'))
          PY
          python3 ci/prepare_source.py
      - name: Compile all configured tweaks
        run: |
          set -o pipefail
          cd "$SOURCE"
          make -j3 all CODESIGN_IPA=0 ARCHS=arm64 SIDELOAD=1 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Export compiled libraries and original resources
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, tarfile
          from pathlib import Path
          root = Path(os.environ['SOURCE'])
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'output'
          out.mkdir()
          app = Path(os.environ['RUNNER_TEMP']) / 'export-components/YouTube.app'
          app.mkdir(parents=True)
          resources = root/'Resources'
          if resources.exists():
              for p in resources.iterdir():
                  if p.name == 'Info.plist':
                      shutil.copy2(p, out/'Resources-Info.plist')
                  elif p.is_dir():
                      shutil.copytree(p, app/p.name, dirs_exist_ok=True)
                  elif p.is_file():
                      shutil.copy2(p, app/p.name)
          frameworks = app/'Frameworks'
          frameworks.mkdir(exist_ok=True)
          makefile = (root/'Makefile').read_text()
          match = re.search(r'^YTLitePlus_INJECT_DYLIBS\s*=\s*(.+)$', makefile, re.M)
          if not match:
              raise SystemExit('Missing configured injection list')
          sources = ['.theos/obj/YTLitePlus.dylib'] + match[1].split()
          if len(sources) != 16:
              raise SystemExit(f'Unexpected injection count: {len(sources)}')
          injections = []
          for relative in sources:
              p = root/relative
              if not p.is_file() or p.stat().st_size < 4096:
                  raise SystemExit(f'Missing compiled library: {relative}')
              shutil.copy2(p, frameworks/p.name)
              injections.append({'name':'@rpath/'+p.name, 'weak':True})
          alderis = root/'.theos/obj/install/Library/Frameworks/Alderis.framework'
          (frameworks/'Alderis.framework').mkdir(exist_ok=True)
          for p in alderis.iterdir():
              if p.is_file():
                  shutil.copy2(p, frameworks/'Alderis.framework'/p.name)
          substrate = Path(os.environ['THEOS'])/'mod/jailed/lib/CydiaSubstrate.framework'
          shutil.copytree(substrate, frameworks/substrate.name, dirs_exist_ok=True)
          bundle_sources = {
              'YTLite.bundle': root/'Tweaks/YTLite/var/jb/Library/Application Support/YTLite.bundle',
              'YTUHD.bundle': root/'Tweaks/YTUHD/layout/Library/Application Support/YTUHD.bundle',
              'YouPiP.bundle': root/'Tweaks/YouPiP/layout/Library/Application Support/YouPiP.bundle',
              'RYD.bundle': root/'Tweaks/Return-YouTube-Dislikes/layout/Library/Application Support/RYD.bundle',
              'YTABC.bundle': root/'Tweaks/YTABConfig/layout/Library/Application Support/YTABC.bundle',
              'YouMute.bundle': root/'Tweaks/YouMute/layout/Library/Application Support/YouMute.bundle',
              'DontEatMyContent.bundle': root/'Tweaks/DontEatMyContent/layout/Library/Application Support/DontEatMyContent.bundle',
              'YTHoldForSpeed.bundle': root/'Tweaks/YTHoldForSpeed/layout/Library/Application Support/YTHoldForSpeed.bundle',
              'iSponsorBlock.bundle': root/'Tweaks/iSponsorBlock/layout/Library/Application Support/iSponsorBlock.bundle',
              'YTVideoOverlay.bundle': root/'Tweaks/YTVideoOverlay/layout/Library/Application Support/YTVideoOverlay.bundle',
              'YouQuality.bundle': root/'Tweaks/YouQuality/layout/Library/Application Support/YouQuality.bundle',
              'YouTimeStamp.bundle': root/'Tweaks/YouTimeStamp/layout/Library/Application Support/YouTimeStamp.bundle',
              'YouLoop.bundle': root/'Tweaks/YouLoop/layout/Library/Application Support/YouLoop.bundle',
              'YTLitePlus.bundle': root/'lang/YTLitePlus.bundle'
          }
          for name,p in bundle_sources.items():
              if not p.is_dir():
                  raise SystemExit(f'Missing resources: {p}')
              shutil.copytree(p, app/name, dirs_exist_ok=True)
          for p in (root/'Extensions').glob('*.appex'):
              shutil.copytree(p, app/'PlugIns'/p.name, dirs_exist_ok=True)
          if (app/'YouTube').exists() or (app/'Info.plist').exists():
              raise SystemExit('Refusing to export an app fixture')
          manifest = {'source_repository':'bhackel/YTLitePlus','source_commit':os.environ['SOURCE_SHA'],'youtube_version':'21.41.5','ytlite_version':'5.0.1','injections':injections,'rpath':'@executable_path/Frameworks','components_only':True,'requires_dependency_rewrite':True,'build_commit':os.environ['GITHUB_SHA'],'submodules':subprocess.check_output(['git','-C',str(root),'submodule','status','--recursive'],text=True),'files':{}}
          for p in sorted(app.rglob('*')):
              if p.is_file():
                  manifest['files'][str(p.relative_to(app))] = hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          shutil.copy2(Path(os.environ['GITHUB_WORKSPACE'])/'ci/prepare_source.py', out/'build-compatibility-fixes.py')
          with tarfile.open(out/'components.tar.gz','w:gz') as tar:
              tar.add(app, arcname='YouTube.app')
          print(json.dumps({'injections':injections,'file_count':len(manifest['files'])},indent=2))
          PY
      - name: Upload compiled component artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytliteplus-components
          path: output/
          if-no-files-found: error
          retention-days: 3
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ytliteplus-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 3
